# Backend CI.
#
# Two jobs, deliberately separate:
#
#   tests      -- the fast SQLite suite. Builds the schema with create_all(),
#                 which is right for testing application behaviour and
#                 structurally blind to migration bugs.
#   migrations -- the Alembic chain against a real PostgreSQL service. This is
#                 the job that catches what the other cannot: the 0017 enum gap
#                 and 0016's DuplicateObject were both invisible to SQLite and
#                 would have failed on a real deployment.
#
# Splitting them keeps the common feedback loop fast while still gating merges
# on the slower, higher-fidelity check.
name: Backend tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Test suite (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q -m "not postgres"

  migrations:
    name: Alembic chain (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        # Pinned to the major version the app is developed against. Enum
        # behaviour in particular differs across majors -- ALTER TYPE ADD VALUE
        # could not run inside a transaction before 12.
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migration tests against PostgreSQL
        env:
          # Set, so the tests use this service container rather than booting
          # their own pgserver instance. Without it they would still run, just
          # against a throwaway server -- but testing against the same major
          # version as production is the entire point of this job.
          TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pytest -q -m postgres
