name: Feature request
description: Suggest a capability or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is hard or impossible today? Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: dropdown
    id: role
    attributes:
      label: Who is this for
      options:
        - Administrator
        - Examiner
        - Candidate
        - Operator / deployer
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
