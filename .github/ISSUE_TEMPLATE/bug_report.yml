name: Bug report
description: Something is not working as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as an examiner
        2. Open the exam builder
        3. ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Proctoring
        - Exam taking
        - Exam builder
        - Admin dashboard
        - Authentication / accounts
        - Coding questions
        - Deployment / Docker
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        Deployment: Docker Compose / local
        Browser: Chrome 131
        OS: Windows 11
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output from `docker compose logs core-api` or the browser console.
      render: shell
