# Reverse proxy -- the single public entrypoint for the whole stack.
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;
    error_log  /dev/stderr;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile on;
    keepalive_timeout 65;

    # Face/ID-card frames and proctoring event batches can run to several MB
    # (see backend/app/api/v1/proctoring.py's ImagePayload).
    client_max_body_size 12m;

    upstream core_api {
        server core-api:8000;
    }

    upstream frontend {
        server frontend:8080;
    }

    server {
        listen 8080;
        server_name _;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        # Passed through unchanged -- both sides of this proxy already agree on the /api/v1/...
        # and /api/health prefixes, so this is a pure forward, not a path rewrite (a mismatched
        # rewrite here is the classic way a reverse proxy silently breaks every API call).
        location /api/ {
            proxy_pass http://core_api/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # The Core API stamps its own X-Request-ID when
            # one isn't already present (see app/main.py).
            proxy_set_header X-Request-ID $http_x_request_id;
        }

        # Everything else -- the marketing site and the whole React app -- goes to the frontend
        # container, which owns its own SPA fallback (see frontend/nginx.conf); this proxy
        # doesn't need to know React Router's route list.
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- TLS ---
        # Left commented rather than faked: real certificates are deployment-specific (Let's
        # Encrypt via certbot, a load balancer terminating TLS in front of this, a corporate
        # CA), and the app's own security headers (see backend/app/main.py) deliberately omit
        # HSTS for the TLS-terminating layer to add -- this is that layer.
    }
}
