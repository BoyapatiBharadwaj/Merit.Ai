# Complete nginx config (not a conf.d fragment) for the frontend static-file container,
# so every writable path can live outside root-owned directories.
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Non-root-writable paths -- /var/run and /var/log are root-owned in the
    # base image, and the point of this config is to never need root.
    access_log /dev/stdout;
    error_log  /dev/stderr;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile        on;
    keepalive_timeout  65;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- Security headers ---
    # This container serves the HTML that runs the exam: it holds the user's token, and the page
    # is granted camera, microphone and screen-share permissions.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The app genuinely needs camera and microphone (proctoring) and display capture (screen
    # share) on its own origin, so those are self-allowed rather than blocked.
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=(), payment=(), usb=()" always;

    # Content-Security-Policy.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' https://storage.googleapis.com; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Cheap liveness target for the container HEALTHCHECK -- doesn't exercise the SPA
        # fallback or touch the filesystem beyond this response.
        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        # Hashed build assets (Vite fingerprints every filename) can be cached aggressively.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # SPA fallback: any path that isn't a real static file (every client route -- /login,
        # /exam/:examId, /admin/exams, etc.) is handed index.html so React Router can take over,
        # matching how `vite preview` / the dev server already behave.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # index.html itself must never be cached -- it's the one file whose staleness *would*
        # matter (it references the current build's hashed asset filenames).
        location = /index.html {
            add_header Cache-Control "no-cache";
        }
    }
}
