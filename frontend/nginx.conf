# Complete nginx config (not just a server-block fragment) for the frontend
# static-file container. Runs as the unprivileged `nginx` user on an
# unprivileged port -- see the Dockerfile for why (binding <1024 needs root
# or CAP_NET_BIND_SERVICE, and this process has no reason to need either);
# docker-compose.yml / the reverse-proxy container are what map this onto a
# normal port for anyone outside the Docker network.
#
# This container ONLY serves the built React app as static files with a SPA
# fallback. It knows nothing about the API -- `/api/*` calls made by the app
# (see frontend/src/lib/api.js's relative BASE_URL) are expected to reach
# this same origin and be routed to the Core API by the reverse-proxy
# container in front of this one (see deploy/nginx/nginx.conf), the same
# relationship vite.config.js's dev-server proxy already stands in for
# locally. This container is never meant to be reached directly in
# production.
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Non-root-writable paths -- /var/run and /var/log are root-owned in the
    # base image, and this whole point of this config is to never need root.
    access_log /dev/stdout;
    error_log  /dev/stderr;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile        on;
    keepalive_timeout  65;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- Security headers ----------------------------------------------------
    #
    # This container serves the HTML that runs the exam: it holds the user's
    # token, and the page is granted camera, microphone and screen-share
    # permissions. It previously emitted no security headers at all. The strict
    # CSP in backend/app/main.py applies only to API *responses* -- it never
    # reached the document, which is the only place a CSP actually constrains
    # script execution.
    #
    # `always` on every one of these: without it nginx omits the header on error
    # responses (4xx/5xx), and an error page is exactly where injected content
    # is most likely to end up.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The app genuinely needs camera and microphone (proctoring) and display
    # capture (screen share) on its own origin, so those are self-allowed rather
    # than blocked. Everything else this page has no business asking for.
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=(), payment=(), usb=()" always;

    # Content-Security-Policy.
    #
    # Now that Chart.js, CodeMirror, Inter and MediaPipe are bundled rather than
    # pulled from cdnjs/Google Fonts/jsdelivr (see src/lib/vendor.js), script-src
    # can be 'self' with no third-party origins at all -- which is what makes
    # this policy worth having. Notes on the necessary loosenings:
    #
    #   'wasm-unsafe-eval'  MediaPipe compiles its wasm module at runtime; this
    #                       permits WebAssembly WITHOUT permitting eval() of
    #                       JavaScript, which the older 'unsafe-eval' would have.
    #   style-src 'unsafe-inline'
    #                       Tailwind ships static classes, but React sets inline
    #                       styles on elements and CodeMirror positions its
    #                       cursor/gutters the same way. Removing this needs
    #                       per-request nonces, which a static file server
    #                       cannot generate.
    #   connect-src         'self' covers the API (same origin via the reverse
    #                       proxy). storage.googleapis.com is ONLY needed for the
    #                       face-landmarker weights fallback -- run
    #                       `npm run fetch:model` to self-host them and this
    #                       entry can be deleted.
    #   img-src blob:/data: canvas frames captured from the webcam.
    #   media-src blob:     the MediaStream preview element.
    #   worker-src blob:    MediaPipe runs its wasm in a blob-URL worker.
    #
    # frame-ancestors 'none' duplicates X-Frame-Options for browsers that
    # honour CSP over the older header; both are cheap.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' https://storage.googleapis.com; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Cheap liveness target for the container HEALTHCHECK -- doesn't
        # exercise the SPA fallback or touch the filesystem beyond this
        # response.
        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        # Hashed build assets (Vite fingerprints every filename) can be
        # cached aggressively -- a new deploy ships new filenames, so there's
        # no staleness risk to trade for the cache lifetime.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # SPA fallback: any path that isn't a real static file (every client
        # route -- /login, /exam/:examId, /admin/exams, etc.) is handed
        # index.html so React Router can take over, matching how
        # `vite preview` / the dev server already behave.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # index.html itself must never be cached -- it's the one file whose
        # staleness *would* matter (it references the current build's hashed
        # asset filenames).
        location = /index.html {
            add_header Cache-Control "no-cache";
        }
    }
}
